# Offline checks on every push and pull request: the Python package's tests and its
# install without extras, the browser code's type check and Node tests, the IR core's
# tests, the fixture
# comparison of the virtualizers against the frozen reference (spec/virtualize.md §1.1
# <https://github.com/d-v-b/refkv/blob/main/spec/virtualize.md#11-output-and-equivalence>, with
# spec/bindings/vzip.md's strict reading of every archive), the reproducibility of the fixture
# generators, and the section references, each a link to a heading that exists. TIFF, NDPI, ND2, CZI, DICOM, NIfTI, IMS and SAFE, and Zarr v2, OME-Zarr and N5 stores, go through the Rust core (rust/refkv-ir), built natively
# for Python (`uv sync`, which builds python/, refkv, with its bindings as the module refkv._core) and for wasm32 for the browser code (`just js::wasm`).
# The vzip CLI (rust/refkv-cli) is checked against the Python virtualizer, archive for archive.
# The Python tests, the install without extras, the IR core's tests, the CLI's and the Node tests
# run on Linux, macOS and Windows; the fixture comparison, the fixtures' reproducibility and the
# section references, which do not depend on the system, on Linux only.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

# bash on every runner (Git Bash on Windows), as the justfiles' recipes are
defaults:
  run:
    shell: bash

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # the tests read the repository's text files (UTF-8) without naming an encoding
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/refkv-ir
            python
      # binaryen's wasm-opt shrinks the wasm32 module (rust/refkv-ir/wasm/build.sh; optional)
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends binaryen
      - run: uv sync --all-groups --locked
      - run: npm ci
        working-directory: js
      - run: just js::wasm
      # builds the Rust core first, and runs python/tests/ir with the rest (the Python half
      # of `just ir-test`; the ir job runs its Rust half)
      - run: just test

  # The JS library and its tests run on the oldest Node that js/package.json's engines
  # allows (the LTS most users have) and on the newest (what the project develops on);
  # Node's behavior differs between them, e.g. how fetch goes through a proxy.
  # On Linux, both; on macOS and Windows, the oldest.
  node:
    name: node (${{ matrix.os }}, ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "24" }
          - { os: ubuntu-latest, node: "26" }
          - { os: macos-latest, node: "24" }
          - { os: windows-latest, node: "24" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # js::test also builds the test module (test-only hooks) in its own target directory,
      # rust/refkv-ir/target/test-hooks; cache it beside the shipped module's
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/refkv-ir -> target
            rust/refkv-ir -> target/test-hooks
      # binaryen's wasm-opt shrinks the wasm32 module (rust/refkv-ir/wasm/build.sh; optional)
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends binaryen
      - run: npm ci
        working-directory: js
      - run: just js::test

  ir:
    name: ir (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/refkv-ir
            python
      # binaryen's wasm-opt shrinks the wasm32 module (rust/refkv-ir/wasm/build.sh; optional)
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends binaryen
      - uses: extractions/setup-just@v2
      - run: uv sync --all-groups --locked
      # the core's Rust tests, and a cargo build of its Python bindings' crate (python/); the
      # Python host's tests (python/tests/ir), the other half of `just ir-test`, run in the
      # pytest job, with the rest
      - run: just ir-rust-test
      - run: just ir-wasm

  # The vzip archive writer (rust/refkv-vzip) and the `vzip convert` CLI (rust/refkv-cli): their
  # tests, and the CLI against `python -m refkv.virtualize` on the fixture corpus, whose archives
  # must be the same, byte for byte (`just cli-identical`); and, but on Windows, where it does not
  # build, the conformance harness built on the writer (conformance/impls/rust)
  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/refkv-ir
            rust/refkv-vzip
            rust/refkv-phkv
            rust/refkv-cli
            conformance/impls/rust
            python
      - uses: extractions/setup-just@v2
      - run: uv sync --all-groups --locked
      - run: just cli-test
      - run: just cli-identical
      - if: runner.os != 'Windows'
        run: just impls::rust::test

  fixture-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/refkv-ir
            python
      # binaryen's wasm-opt shrinks the wasm32 module (rust/refkv-ir/wasm/build.sh; optional)
      - run: sudo apt-get install -y --no-install-recommends binaryen
      - run: uv sync --all-groups --locked
      - run: just js::wasm
      - run: >-
          uv run python conformance/virtualize/compare.py conformance/results/fixtures
          --fixtures fixtures --shard ${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-compare-${{ matrix.shard }}
          path: conformance/results/fixtures/results.json

  # The package without its extras (python/pyproject.toml): it reads, writes and virtualizes
  # archives without zarr, and each optional part's ImportError names the extra that
  # installs it; then with only the zarr extra, which reads them through zarr
  base-install:
    name: base-install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/refkv-ir
            python
      # the two venvs, and their Pythons: bin/python, or Scripts/python.exe on Windows (with
      # RUNNER_TEMP's `\` written as `/`, for Git Bash)
      - run: |
          tmp="${RUNNER_TEMP//\\//}"
          bin=bin/python; [ "$RUNNER_OS" = Windows ] && bin=Scripts/python.exe
          { echo "PIP_VENV=$tmp/pip"; echo "PIP_PYTHON=$tmp/pip/$bin"
            echo "ZARR_VENV=$tmp/zarr"; echo "ZARR_PYTHON=$tmp/zarr/$bin"; } >> "$GITHUB_ENV"
      # pip, as docs/README.md#installing says (it builds the Rust core into the wheel)
      - run: uv venv --seed "$PIP_VENV"
      - run: '"$PIP_PYTHON" -m pip install ./python'
      - run: just base-install-check "$PIP_PYTHON" base
      - run: uv venv "$ZARR_VENV"
      - run: uv pip install --python "$ZARR_VENV" "./python[zarr]"
      - run: just base-install-check "$ZARR_PYTHON" zarr

  sections:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # spec/tools imports neither refkv nor its Rust core: install the tools, not the project
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - run: uv sync --all-groups --locked --no-install-package refkv
      # every "§n" is a link to its heading, and every such link resolves (spec/tools/sections.py)
      - run: just sections

  fixtures-reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/refkv-ir
            python
      - run: uv sync --all-groups --locked
      - run: just fixtures-check
