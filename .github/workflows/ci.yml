# Offline checks on every push and pull request: the Python package's tests, the
# browser code's type check and Node tests, the IR core's tests, the fixture
# comparison of the virtualizers against the frozen reference (VIRTUALIZE.md §1.1, with
# SPEC.md's strict reading of every archive), and the reproducibility of the fixture
# generators. TIFF, ND2 and CZI go through the Rust core (rust/vzip-ir), built natively
# for Python (`just ir-build`) and for wasm32 for the browser code (`just web::wasm`).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/vzip-ir
      # binaryen's wasm-opt shrinks the wasm32 module (rust/vzip-ir/wasm/build.sh; optional)
      - run: sudo apt-get install -y --no-install-recommends binaryen
      - run: uv sync --all-groups --locked
      - run: npm ci
        working-directory: web
      - run: just web::wasm
      # builds the Rust core first; the ir job runs tests/ir
      - run: just test --ignore=tests/ir

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # web::test also builds the test module (test-only hooks) in its own target directory,
      # rust/vzip-ir/target/test-hooks; cache it beside the shipped module's
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/vzip-ir -> target
            rust/vzip-ir -> target/test-hooks
      # binaryen's wasm-opt shrinks the wasm32 module (rust/vzip-ir/wasm/build.sh; optional)
      - run: sudo apt-get install -y --no-install-recommends binaryen
      - run: npm ci
        working-directory: web
      - run: just web::test

  ir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/vzip-ir
      # binaryen's wasm-opt shrinks the wasm32 module (rust/vzip-ir/wasm/build.sh; optional)
      - run: sudo apt-get install -y --no-install-recommends binaryen
      - uses: extractions/setup-just@v2
      - run: uv sync --all-groups --locked
      - run: just ir-test
      - run: just ir-wasm

  fixture-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: extractions/setup-just@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/vzip-ir
      # binaryen's wasm-opt shrinks the wasm32 module (rust/vzip-ir/wasm/build.sh; optional)
      - run: sudo apt-get install -y --no-install-recommends binaryen
      - run: uv sync --all-groups --locked
      - run: just ir-build
      - run: just web::wasm
      - run: >-
          uv run python conformance/virtualize/compare.py conformance/results/fixtures
          --fixtures web/test/fixtures --shard ${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-compare-${{ matrix.shard }}
          path: conformance/results/fixtures/results.json

  fixtures-reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2
      - run: uv sync --all-groups --locked
      - run: just fixtures-check
