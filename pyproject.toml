[project]
name = "vzip"
version = "0.1.0"
description = "vzip: a ZIP container for byte-range references (reference implementation and experiments)"
authors = [
    { name = "Davis Vann Bennett", email = "davis.v.bennett@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
dependencies = [
    "aiohttp>=3.14.3",
    "fastparquet>=2026.9.0",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "icechunk>=2.2.2",
    "imagecodecs>=2026.8.16",
    "kerchunk>=0.2.10",
    "numpy>=2.5.3",
    "obstore>=0.11.1",
    "protobuf>=7.36.2",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "tifffile>=2026.9.20",
    "virtualizarr>=2.7.3",
    "xarray>=2026.9.0",
    "zarr>=3.4.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
