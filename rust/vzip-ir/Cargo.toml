[package]
name = "vzip-ir"
version = "0.1.0"
edition = "2024"
description = "vzip's intermediate representation: a compact columnar IR, sans-IO parsers, and the schema checker"
license = "MIT OR Apache-2.0"

[lib]
name = "vzip_ir"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# The Python bindings (built by maturin); the core builds without them, for wasm32.
python = ["dep:pyo3"]
# Test-only C-ABI hooks of the wasm32 module (`wasm/build.sh test`); never in the shipped module.
test-hooks = []

[dependencies]
miniz_oxide = "0.8"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"], optional = true }

[profile.release]
opt-level = 3
debug = false

# The wasm32 module (wasm/build.sh, then wasm-opt -O3): whole-program optimization,
# one codegen unit and opt-level 2, no unwinding (a panic aborts, as it already does
# on wasm32-unknown-unknown). Against the release profile: 27% smaller (12% gzipped)
# at the same speed; opt-level "s" would be 9% smaller still, and 20% slower.
[profile.wasm]
inherits = "release"
lto = true
codegen-units = 1
opt-level = 2
panic = "abort"
