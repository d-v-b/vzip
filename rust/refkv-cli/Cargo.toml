# The `vzip` command: `vzip convert`, a legacy image file or store virtualized into a .vzip
# archive, the archive python -m refkv.virtualize writes, byte for byte. The host of the Rust core
# (rust/refkv-ir, sans-IO), ported from refkv's Python host: the reads (a local file or directory,
# or http(s) under the reader policy), the store listings, and the archive (rust/refkv-vzip). A
# crate of its own, not a member of a Cargo workspace (python/Cargo.toml says why).
[package]
name = "refkv-cli"
version = "0.1.0"
edition = "2024"
description = "vzip convert: legacy image files and stores virtualized into vzip archives"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "vzip"
path = "src/main.rs"

[dependencies]
refkv-ir = { path = "../refkv-ir" }
refkv-vzip = { path = "../refkv-vzip" }
refkv-phkv = { path = "../refkv-phkv" }
crc32c = "0.6"
memmap2 = "0.9"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# HTTP/1.1 with rustls; no gzip (every request asks for the identity encoding), and no proxy
# from the environment (the reader policy refuses a request a proxy would make)
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = 3
debug = false
